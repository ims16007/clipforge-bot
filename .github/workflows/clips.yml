name: Clips automáticos

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch: {}      # botón para lanzarlo a mano

concurrency:
  group: clips               # nunca dos a la vez
  cancel-in-progress: false

permissions:
  contents: write            # para guardar el progreso (state.enc)
  actions: write             # para relanzarse si el directo sigue

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # GitHub permite 6 h; el bot para a las 5 h 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt

      - name: Buscar directos, crear y subir clips
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py

      - name: Guardar el progreso
        if: always()
        run: |
          git config user.name "clipforge-bot"
          git config user.email "clipforge-bot@users.noreply.github.com"
          git add state.enc
          git diff --cached --quiet || (git commit -q -m "Progreso de clips" && git push -q)

      - name: Seguir si el directo continúa
        if: always() && hashFiles('relaunch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clips.yml --ref main

      - name: Clips de esta vuelta (descargables 7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: clips/
          if-no-files-found: ignore
          retention-days: 7
